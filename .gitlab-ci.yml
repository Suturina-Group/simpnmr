stages:
- deploy

variables:
  # change pip's cache location to inside the project
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Documentation
pages:
  image: python:latest
  stage: deploy
  cache:
    paths:
      - .cache/pip
      - docs_venv/
  script:
  - git checkout "$CI_COMMIT_REF_NAME"
  - pip install virtualenv
  - virtualenv docs_venv
  - source docs_venv/bin/activate
  - pip install -e .
  - cd docs
  - pip install -r requirements.txt
  - pip install anybadge ${PKG_NAME} --upgrade
  - make html
  - mv build/html ../public
  - export VERSION=$(grep -oP '__version__ = "\K[^"]+' ../simpnmr/__version__.py)
  - rm -f ../public/docs.svg
  - anybadge -l Documentation -v $VERSION -f ../public/docs.svg --color green -o
  artifacts:
    paths:
    - public
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never

release:
  stage: deploy
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    - pip install python-semantic-release build twine
    - git config --global user.name "semantic-release"
    - git config --global user.email "semantic-release@example.com"
    - git checkout -B "$CI_COMMIT_BRANCH" "$CI_COMMIT_SHA"
  script:
    - rm -rf dist/*
    - semantic-release version --push --vcs-release
    - semantic-release publish
    - |
      if ls dist/* 1> /dev/null 2>&1; then
        python -m twine upload --non-interactive --skip-existing dist/*
      else
        echo "No distributions to upload, skipping twine."
      fi
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^chore\(release\):/'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never
