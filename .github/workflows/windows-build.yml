name: Windows installer

# Builds the SimpNMR Windows desktop application and Inno Setup installer.
#
# GitLab.com does not provide hosted Windows runners on the free tier, so the
# Windows build runs here on GitHub Actions' free `windows-latest` runner.
# If this project lives on GitLab, mirror it to GitHub (or push a copy) so this
# workflow can run.
#
# Triggers:
#   * on version tags (v*)  -> builds and attaches the installer to a release
#   * manually (dispatch)   -> builds and uploads the installer as an artifact

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build app and installer
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File packaging\windows\build.ps1

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem packaging\windows\Output\SimpNMR-Setup-*.exe | Select-Object -First 1
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpNMR-Windows-Installer
          path: ${{ steps.installer.outputs.path }}

      - name: Attach installer to GitLab release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          pwsh -ExecutionPolicy Bypass -File packaging\windows\upload-gitlab-release.ps1 `
            -Version $version -InstallerPath "${{ steps.installer.outputs.path }}"
